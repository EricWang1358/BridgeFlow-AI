# The single CI file for this repo (history: fea1fdd removed the old three-file
# CI with the note that it should come back as one file — this is that file).
#
# test -> deploy: merges to main are tested offline (conftest isolates the
# provider), then deployed to the Lightsail instance over SSH.
# See docs/22-lightsail-deploy.md for the instance-side runbook.
#
# Required GitHub secrets: SSH_HOST, SSH_USER, SSH_PRIVATE_KEY.
# Required GitHub variable: PUBLIC_DOMAIN.
# DEEPSEEK_API_KEY never enters GitHub — it lives only in env.sh on the
# instance (see CLAUDE.md: bootstrap variables come from the launching shell).

name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install backend
        run: |
          # --clear: newer uv refuses to create a venv where one already
          # exists, and setup-uv leaves a .venv behind on the runner.
          uv venv .venv --clear
          uv pip install -e "backend[dsh,dev]" --python .venv/bin/python

      - name: Ruff
        run: .venv/bin/ruff check backend/src backend/tests scripts/start_web.py

      - name: Pytest (offline; conftest isolates the provider)
        working-directory: backend
        run: ../.venv/bin/pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Use the same package manager as local development and deployment.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: plugins/package.json

      - name: Plugins typecheck + build + unit tests
        run: |
          pnpm --dir plugins install --frozen-lockfile
          pnpm --dir plugins run typecheck
          pnpm --dir plugins run build
          pnpm --dir plugins test

  deploy:
    # Temporarily gated off: the Lightsail instance isn't provisioned yet.
    # Re-enable without a commit by adding repo variable DEPLOY_ENABLED=true
    # (Settings → Secrets and variables → Actions → Variables).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Copy deploy.sh out of the checkout before running it: the script
      # git-resets the working tree it would otherwise be executing from
      # (bash reads scripts lazily), and the /tmp copy guarantees the script
      # version matches the commit being deployed.
      - name: Upload deploy scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/deploy.sh,deploy/config-put.sh"
          target: "/tmp/bf-deploy"

      # Instance-side config (docs/22 §5/§9c) is gitignored, so code deploys never
      # carry it. The file contents live as production-environment secrets and are
      # piped to the instance base64-encoded — a plain export would break on the
      # apostrophes in YAML comments. config-put.sh validates with the product's
      # own loaders before an atomic swap; an invalid file fails here, before
      # deploy.sh restarts anything. An unset secret is skipped, not an error:
      # a hand-placed instance file keeps serving until a secret replaces it.
      - name: Encode configuration for transfer
        id: config_b64
        run: |
          echo "acl=$(printf '%s' "$ACCESS_CONTROL_YAML" | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "dictionary=$(printf '%s' "$FIELD_DICTIONARY_YAML" | base64 -w0)" >> "$GITHUB_OUTPUT"
        env:
          ACCESS_CONTROL_YAML: ${{ secrets.ACCESS_CONTROL_YAML }}
          FIELD_DICTIONARY_YAML: ${{ secrets.FIELD_DICTIONARY_YAML }}

      - name: Sync instance configuration
        uses: appleboy/ssh-action@v1
        env:
          # base64 of a secret is NOT masked in logs (it is not the literal);
          # these are piped into config-put.sh, never echoed.
          ACL_B64: ${{ steps.config_b64.outputs.acl }}
          DICT_B64: ${{ steps.config_b64.outputs.dictionary }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ACL_B64,DICT_B64
          script: |
            if [ -n "$ACL_B64" ]; then
              printf '%s' "$ACL_B64" | bash /tmp/bf-deploy/deploy/config-put.sh access-control.yaml
            else
              echo "config-put: skip access-control.yaml (secret ACCESS_CONTROL_YAML is empty)"
            fi
            if [ -n "$DICT_B64" ]; then
              printf '%s' "$DICT_B64" | bash /tmp/bf-deploy/deploy/config-put.sh field-dictionary.yaml
            else
              echo "config-put: skip field-dictionary.yaml (secret FIELD_DICTIONARY_YAML is empty)"
            fi

      - name: Run deploy on instance
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Pass the exact tested commit: deploy.sh defaults to origin/main,
          # which could have moved on while the test job ran.
          script: bash /tmp/bf-deploy/deploy/deploy.sh ${{ github.sha }}

      # dsh web's session fence (Feishu auth) answers anonymous / with 401 —
      # that proves both the process and the fence are up. Only 000 (no
      # listener) and 5xx (Caddy can't reach upstream) mean bad deploy.
      # Sign-in itself (Feishu OAuth) is exercised manually per docs/22 §13 —
      # automating it would put Feishu credentials into GitHub.
      - name: Public liveness check
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ vars.PUBLIC_DOMAIN }}/" || true)
          case "$code" in
            200|301|302|401) ;;
            *) echo "unexpected status $code (expected 2xx/3xx/401 from dsh web)"; exit 1 ;;
          esac
          pcode=$(curl -s -o /dev/null -w "%{http_code}" "https://portal.${{ vars.PUBLIC_DOMAIN }}/health" || true)
          if [ "$pcode" != "200" ]; then
            echo "portal health returned $pcode (expected 200)"
            exit 1
          fi
