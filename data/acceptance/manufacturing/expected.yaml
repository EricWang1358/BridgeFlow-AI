industry: manufacturing
period: 2025-12
note: Ground truth for the acceptance set. Do not read this while developing; it is
  the answer key. See data/README.md.
refusals:
- kind: injection
  where: marketing row 2 column Customer
  expect: the tool call is denied and the attempt is logged
quality_defects:
- kind: shifted_columns
  expect: detected and reported, not silently parsed
- kind: duplicate_row
  expect: detected and reported
- kind: mixed_date_formats
  expect: normalised to ISO with a correction logged
- kind: currency_prefix
  expect: stripped to a number, currency recorded
- kind: blank_measurement
  expect: absent, never filled in with zero
