derived:
  财务_项目财务净利润:
    op: subtract
    args:
    - op: subtract
      args:
      - op: input
        key: 财务_本期实现收入
      - op: input
        key: 财务_本期实际成本
    - op: input
      key: 财务_资金占用利息成本
  市场_产值收款率:
    op: divide
    args:
    - op: input
      key: 市场_累计收款
    - op: input
      key: 市场_累计产值
  市场_结算收款率:
    op: divide
    args:
    - op: input
      key: 市场_累计收款
    - op: input
      key: 市场_累计结算
  市场_收款计划合计:
    op: add
    args:
    - op: add
      args:
      - op: input
        key: 市场_已到账
      - op: input
        key: 市场_已落实
    - op: add
      args:
      - op: input
        key: 市场_有把握
      - op: input
        key: 市场_可争取
  市场_垫资比例:
    op: divide
    args:
    - op: input
      key: 市场_当前垫资额
    - op: input
      key: 市场_累计产值
  生产_实际签收率:
    op: divide
    args:
    - op: input
      key: 生产_实际量
    - op: input
      key: 生产_出厂量
  生产_产量环比增长率:
    op: divide
    args:
    - op: subtract
      args:
      - op: input
        key: 生产_实际量
      - op: input
        key: 生产_上月实际量
    - op: input
      key: 生产_上月实际量
  物资_当月物资总成本:
    op: multiply
    args:
    - op: input
      key: 物资_当月生产量
    - op: input
      key: 物资_不含税成本
  物资_单方不含税毛利:
    op: subtract
    args:
    - op: divide
      args:
      - op: input
        key: 市场_合同销售单价
      - op: add
        args:
        - op: constant
          value: 1
        - op: declared
          key: 增值税税率
    - op: input
      key: 物资_不含税成本
checks:
- id: production_volume_matches
  title: 物资部当月生产量与生产部生产量一致
  left: 物资_当月生产量
  right: 生产_生产量
  tolerance: 0
undeclared_rules:
  市场_缺口: 字典未给出「目标」字段，缺口只能原样传递，不能计算
  生产_客户合作状态诊断: 字典未给出签收率与环比的判定阈值，只能原样传递
