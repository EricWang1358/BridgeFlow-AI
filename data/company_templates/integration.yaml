# 跨部门业务整合声明（由字典 v2 逐行转写，人工核对后生效）
#
# 来源：data/company_templates/source/dictionary-v2.xlsx（业务方提供）。fields 段逐字段对应字典的「来源表字段」列；
# derived 段对应字典「详细含义与用途描述」里写明的公式；checks 对应字典写明的跨部门核对。
# 字典没有写的规则（增值税税率、缺口公式、合作状态判定阈值）不在这里补——由业务方确认后再声明。
# 测试会逐字段比对本文件与字典、与各模板表头、与总表模板列序，不一致即失败。
version: 字典 v2（业务方 2026-09-13 提供）
source_dictionary: source/dictionary-v2.xlsx
master_template: source/master-v2.xlsx
