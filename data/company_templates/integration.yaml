derived:
  财务_项目财务净利润:
    op: subtract
    args:
    - op: subtract
      args:
      - op: input
        key: 财务_本期实现收入
      - op: input
        key: 财务_本期实际成本
    - op: input
      key: 财务_资金占用利息成本
  市场_产值收款率:
    op: divide
    args:
    - op: input
      key: 市场_累计收款
    - op: input
      key: 市场_累计产值
  市场_结算收款率:
    op: divide
    args:
    - op: input
      key: 市场_累计收款
    - op: input
      key: 市场_累计结算
  市场_收款计划合计:
    op: add
    args:
    - op: add
      args:
      - op: input
        key: 市场_已到账
      - op: input
        key: 市场_已落实
    - op: add
      args:
      - op: input
        key: 市场_有把握
      - op: input
        key: 市场_可争取
  市场_垫资比例:
    op: divide
    args:
    - op: input
      key: 市场_当前垫资额
    - op: input
      key: 市场_累计产值
  生产_实际签收率:
    op: divide
    args:
    - op: input
      key: 生产_实际量
    - op: input
      key: 生产_出厂量
  生产_产量环比增长率:
    op: divide
    args:
    - op: subtract
      args:
      - op: input
        key: 生产_实际量
      - op: input
        key: 生产_上月实际量
    - op: input
      key: 生产_上月实际量
  物资_当月物资总成本:
    op: multiply
    args:
    - op: input
      key: 物资_当月生产量
    - op: input
      key: 物资_不含税成本
  物资_单方不含税毛利:
    op: subtract
    args:
    - op: divide
      args:
      - op: input
        key: 市场_合同销售单价
      - op: add
        args:
        - op: constant
          value: 1
        - op: declared
          key: 增值税税率
    - op: input
      key: 物资_不含税成本
  市场_缺口:
    op: subtract
    args:
    - op: input
      key: 市场_累计结算
    - op: input
      key: 市场_收款计划合计
classifications:
  生产_客户合作状态诊断:
    rules:
    - label: 签收异常
      when:
      - [生产_实际签收率, lt, 0.95]
    - label: 合作萎缩
      when:
      - [生产_产量环比增长率, lte, -0.2]
    - label: 需求下滑
      when:
      - [生产_产量环比增长率, lt, -0.05]
    - label: 稳定增长
      when:
      - [生产_产量环比增长率, gte, 0.05]
    otherwise: 平稳合作
rollup:
  production:
    sum:
    - 生产_生产量
    - 生产_出厂量
    - 生产_实际量
    concat:
    - 生产_厂站
    - 生产_备注
    recompute:
    - 生产_实际签收率
    - 生产_产量环比增长率
    - 生产_客户合作状态诊断
checks:
- id: production_volume_matches
  title: 物资部当月生产量与生产部生产量一致
  left: 物资_当月生产量
  right: 生产_生产量
  tolerance: 0
# 跨期对比（E13-UC02）：哪些字段可以跨项目相加、哪些变化需要进入关注区。
# 单价与比率不可相加（相加得到的数没有业务含义），因此只列数量与金额；阈值与诊断规则表同口径。
comparison:
  additive:
  - 生产_生产量
  - 生产_出厂量
  - 生产_实际量
  - 物资_当月生产量
  - 物资_当月物资总成本
  - 财务_本期实现收入
  - 财务_本期实际成本
  - 财务_资金占用利息成本
  - 财务_项目财务净利润
  - 市场_累计产值
  - 市场_累计结算
  - 市场_累计收款
  - 市场_合同欠款
  - 市场_总欠款
  - 市场_当前垫资额
  - 市场_缺口
  thresholds:
    生产_实际量:
      relative_below: -0.2
    市场_总欠款:
      relative_above: 0.2
# 哪些模板列沿用上期的哪个声明字段（E14-UC02）。沿用是声明，不是代码猜测：
# 生产部模板的「上月实际量」按定义就是上期的「实际量」，业务方要改沿用关系改这里。
carry_over:
  production:
    rules:
    - {column: 上月实际量, from_field: 生产_实际量, offset: -1}
assumptions:
  增值税税率: 字典未写税率。按一般纳税人销售货物的通用税率 13% 取值；业务方示例 339÷1.13−260=40 与此一致。
  市场_缺口: 字典写「目标与预计可收回款项之间的差距」，模板里没有「目标」列。按回款管理的通用做法以累计结算为目标：缺口 = 累计结算 − 收款计划合计；业务方示例 1,200,000−1,150,000=50,000 与此一致。
  生产_客户合作状态诊断: 字典只说按签收率与环比判断。按常用口径：签收率低于 95% 先判签收异常；环比 ±5% 以内视为正常波动（平稳合作），≥5% 稳定增长，<−5% 需求下滑，≤−20% 合作萎缩；按规则顺序取第一条命中。业务方示例（签收率 99.4%、环比 10%）判为稳定增长，与此一致。
  rollup.production: 生产部模板带「日期」，可按日填报。同一项目、客户、月份的多行按通用做法汇总：生产量、出厂量、实际量求和；厂站与备注去重拼接；签收率、环比与合作状态用汇总后的数重新计算，不平均各行比率；上月实际量等其余字段必须各行一致，不一致即拒绝。
undeclared_rules: {}
