# English display names for the business's Chinese field names and declared wording.
#
# Display only. Nothing is joined, computed or validated from this file: the declarations
# (integration.yaml, the field dictionary) stay the single source of truth, and their Chinese
# names are what every file, formula and download keeps. The English interface shows these
# beside the original ("Customer name · 客户名称") so a reader without Chinese can follow
# and a reader with the spreadsheet can still find the column.
#
# A prefixed master column ("财务_期初金额") is shown from its parts: department, then name.
# Values — company, project and material names — are data and are never translated here.
# A missing entry falls back to the original text; add it here, never in code.
