# Longer declared wording, keyed by the exact original text.
texts:
  字典 v2（业务方 2026-09-13 提供）: Dictionary v2 (provided by the business, 2026-09-13)
  物资部当月生产量与生产部生产量一致: Procurement’s monthly production volume matches Production’s
  字典未写税率。按一般纳税人销售货物的通用税率 13% 取值；业务方示例 339÷1.13−260=40 与此一致。: >-
    The dictionary gives no tax rate. The general 13% rate for a general taxpayer selling goods is used;
    the business’s own example 339÷1.13−260=40 agrees.
  字典写「目标与预计可收回款项之间的差距」，模板里没有「目标」列。按回款管理的通用做法以累计结算为目标：缺口 = 累计结算 − 收款计划合计；业务方示例 1,200,000−1,150,000=50,000 与此一致。: >-
    The dictionary says “the gap between the target and the amount expected to be collected”, but the
    template has no target column. Following common collection practice, cumulative settlement is the
    target: Gap = Cumulative settlement − Collection plan total; the business’s example
    1,200,000−1,150,000=50,000 agrees.
  字典只说按签收率与环比判断。按常用口径：签收率低于 95% 先判签收异常；环比 ±5% 以内视为正常波动（平稳合作），≥5% 稳定增长，<−5% 需求下滑，≤−20% 合作萎缩；按规则顺序取第一条命中。业务方示例（签收率 99.4%、环比 10%）判为稳定增长，与此一致。: >-
    The dictionary only says to judge by sign-off rate and month-on-month change. Common practice is used:
    a sign-off rate below 95% is a sign-off anomaly first; within ±5% month on month is normal variation
    (steady relationship), ≥5% steady growth, <−5% demand falling, ≤−20% relationship shrinking; the first
    rule that matches wins. The business’s example (sign-off 99.4%, +10%) is steady growth, which agrees.
  生产部模板带「日期」，可按日填报。同一项目、客户、月份的多行按通用做法汇总：生产量、出厂量、实际量求和；厂站与备注去重拼接；签收率、环比与合作状态用汇总后的数重新计算，不平均各行比率；上月实际量等其余字段必须各行一致，不一致即拒绝。: >-
    The production template has a date column, so it can be filled daily. Rows for the same project,
    customer and month are rolled up the usual way: production, dispatched and actual volumes are summed;
    plants and notes are de-duplicated and joined; sign-off rate, month-on-month change and relationship
    status are recomputed from the totals rather than averaging row ratios; every other field, such as
    last month’s actual volume, must agree across rows or the roll-up is refused.
  # The department review declaration (business_review in the sample dictionary)
  模拟商砼公司 2024-07 月度对账（业务方 v2 模板，虚构数据）: Simulated concrete supplier, 2024-07 monthly reconciliation (business v2 templates, fictional data)
  生产部核对签收差额，物资部确认测算与毛利，财务部复核利润与应收，市场部落实催收与垫资控制；本报告不自动调整结算、售价或授信。: >-
    Production checks the sign-off difference, Procurement confirms the estimate and margin, Finance reviews
    profit and receivables, Marketing follows up collections and advance funding. This report changes no
    settlement, price or credit by itself.
  核对出厂量与现场签收量、生产余料，提出车次核对与退料处置；不得认定客户违约或调整结算量。: >-
    Check dispatched against signed-off volume and production leftovers; propose truck checks and handling of
    returned material. May not find a customer in breach or change settled volumes.
  核对材料成本占收入比重、加权单方毛利，以及物资测算量与生产实际量是否一致；不得自行改合同售价。: >-
    Check material cost as a share of revenue, weighted margin per m³, and whether the materials estimate matches
    actual production. May not change contract prices.
  核对项目净利率与应收余额相当于几个月开票额，提出利润与回款复核；不得认定坏账或计提减值。: >-
    Check project net margin and how many months of billing the receivables equal; propose profit and collection
    reviews. May not declare bad debt or book impairments.
  核对结算收款率、垫资比例与收款计划缺口，提出催收与垫资控制建议；不得自行调整客户账期或授信。: >-
    Check the collection rate on settlement, the advance funding ratio and the collection plan gap; propose
    collection and funding controls. May not change customer terms or credit.
  不做坏账、减值或客户信用分级判断: No bad-debt, impairment or customer credit rating judgements
  增值税 13%、缺口公式与诊断阈值是按通用做法补的口径，业务方尚未确认: >-
    VAT 13%, the gap formula and the diagnosis thresholds are common-practice conventions the business has not
    confirmed yet
  指标为公司级月度汇总；项目级核对与跨部门字段一致性看「跨部门总表」: >-
    Metrics are company-level monthly totals; for project-level checks and cross-department consistency see the
    Cross-department master
  模拟商砼公司数据，用于演示业务方 v2 模板的月度对账，不代表真实经营结论: >-
    Simulated concrete supplier data, demonstrating the monthly reconciliation of the business’s v2 templates;
    not a real business conclusion
  应收月数是余额与当月开票之比，不是账龄: Receivable months is balance over this month’s billing, not ageing
  垫资比例是公司级汇总，项目差异须看跨部门总表: The advance funding ratio is company-level; see the Cross-department master for project differences
  缺口口径为累计结算减收款计划合计，是业务方未确认的口径假设: >-
    The gap is cumulative settlement minus the collection plan total, a convention the business has not confirmed
  单方毛利按增值税 13% 折算不含税售价，税率是口径假设: Margin per m³ converts the price at 13% VAT; the rate is an assumed convention
  测算量与生产量不一致时，先更正测算再比较成本: When the estimate and production disagree, correct the estimate before comparing cost
  签收率是公司级月度汇总，不是单个项目的结论: The sign-off rate is a company-level monthly total, not a finding about one project
  签收量差额须与市场部、现场核对后才能进入结算: A signed-off volume difference goes into settlement only after checking with Marketing and the site

  # The quotation declaration (quotation in the sample dictionary)
  模拟样板。按定价与信用政策从询价记录、成本与产能依据测算价格带，检查产能、交期、回款与付款条件；未经政策规定的审批人批准不得外发。: >-
    Simulated sample. The price band is computed from the enquiry, cost and capacity evidence under the pricing
    and credit policy, checking capacity, lead time, collections and payment terms; nothing goes out without the
    approver the policy names.
  记录客户需求与商务条件，按审批结果报出，不自行承诺价格与账期。: Records the customer’s needs and terms and quotes as approved; never promises a price or payment terms alone.
  按当月到厂价与配合比测算材料成本，提供运输泵送及制造费用口径。: Computes material cost from this month’s delivered prices and the mix design; supplies the transport, pumping and production cost basis.
  确认可承接方量与新项目准备周期。: Confirms available capacity and the new project lead time.
  核实客户历史回款、确定信用等级与资金占用成本。: Checks the customer’s collection history and sets the credit grade and financing cost.
  审批低于底价或付款条件低于信用等级下限的报价。: Approves quotes below the floor price or with payment terms below the credit grade’s minimum.
  客户期望价低于底价，报出须总经理审批: The customer’s target price is below the floor; quoting needs the general manager’s approval
  客户期望价低于目标价，报出须销售总监审批: The customer’s target price is below target; quoting needs the sales director’s approval
  月峰值超过可承接方量，须生产部重新排产后再报价: Peak monthly demand exceeds capacity; Production must reschedule before quoting
  历史回款超过 75 天（C 级），须款到发货或财务总监审批: Collections have taken over 75 days (grade C); cash before delivery or the finance director’s approval
  付款比例低于 B 级下限 70%，须总经理审批: The payment ratio is below grade B’s 70% minimum; needs the general manager’s approval
  准备周期长于客户首次浇筑时间，须重新协商供货日: The lead time is longer than the time to first pour; renegotiate the supply date
  内部报价草稿。价格低于底价须总经理审批，介于底价与目标价之间须销售总监审批；审批前不得外发，外发须复用原生审批并取得针对本报价的批准。: >-
    Internal quote draft. Below the floor price needs the general manager; between floor and target needs the
    sales director. Nothing goes out before approval, and sending it needs a native approval for this quote.
