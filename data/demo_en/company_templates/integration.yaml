      from_field: Production · Actual volume
      offset: -1
assumptions:
  VAT rate: The dictionary gives no tax rate. The general 13% rate for a general taxpayer selling goods is used;
    the business’s own example 339÷1.13−260=40 agrees.
  Marketing · Gap: 'The dictionary says “the gap between the target and the amount expected to be collected”, but
    the template has no target column. Following common collection practice, cumulative settlement is the target:
    Gap = Cumulative settlement − Collection plan total; the business’s example 1,200,000−1,150,000=50,000 agrees.'
  Production · Customer relationship status: 'The dictionary only says to judge by sign-off rate and month-on-month
    change. Common practice is used: a sign-off rate below 95% is a sign-off anomaly first; within ±5% month on
    month is normal variation (steady relationship), ≥5% steady growth, <−5% demand falling, ≤−20% relationship
    shrinking; the first rule that matches wins. The business’s example (sign-off 99.4%, +10%) is steady growth,
    which agrees.'
  rollup.production: 'The production template has a date column, so it can be filled daily. Rows for the same project,
    customer and month are rolled up the usual way: production, dispatched and actual volumes are summed; plants
    and notes are de-duplicated and joined; sign-off rate, month-on-month change and relationship status are recomputed
    from the totals rather than averaging row ratios; every other field, such as last month’s actual volume, must
    agree across rows or the roll-up is refused.'
