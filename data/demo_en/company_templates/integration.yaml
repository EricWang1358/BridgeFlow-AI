classifications:
  Production · Customer relationship status:
    rules:
    - label: Sign-off anomaly
      when:
      - - Production · Actual sign-off rate
        - lt
        - 0.95
    - label: Relationship shrinking
      when:
      - - Production · Output month-on-month growth
        - lte
        - -0.2
    - label: Demand falling
      when:
      - - Production · Output month-on-month growth
        - lt
        - -0.05
    - label: Steady growth
      when:
      - - Production · Output month-on-month growth
        - gte
        - 0.05
    otherwise: Steady relationship
rollup:
  production:
    sum:
    - Production · Production volume
    - Production · Volume dispatched
    - Production · Actual volume
    concat:
    - Production · Plant
    - Production · Notes
    recompute:
    - Production · Actual sign-off rate
    - Production · Output month-on-month growth
    - Production · Customer relationship status
checks:
- id: production_volume_matches
  title: Procurement’s monthly production volume matches Production’s
  left: Procurement · Monthly production volume
  right: Production · Production volume
  tolerance: 0
comparison:
  additive:
  - Production · Production volume
  - Production · Volume dispatched
  - Production · Actual volume
  - Procurement · Monthly production volume
  - Procurement · Monthly material cost
  - Finance · Period revenue
  - Finance · Period actual cost
