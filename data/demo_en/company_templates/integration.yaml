  - Finance · Project net profit
  - Marketing · Cumulative output value
  - Marketing · Cumulative settlement
  - Marketing · Cumulative collections
  - Marketing · Contract receivable
  - Marketing · Total receivable
  - Marketing · Current advance funding
  - Marketing · Gap
  thresholds:
    Production · Actual volume:
      relative_below: -0.2
    Marketing · Total receivable:
      relative_above: 0.2
carry_over:
