business_review:
  case: Simulated concrete supplier, 2024-07 monthly reconciliation (business v2 templates, fictional data)
  explanation_language: en
  inputs:
    production:
      date_column: date
      nonnegative_columns:
      - production_volume
      - volume_dispatched
      - actual_volume
      - last_month_s_actual_volume
    procurement:
      date_column: reporting_month
      nonnegative_columns:
      - monthly_production_volume
      - monthly_material_cost
      - cost_excl_vat
    finance:
      date_column: reporting_month
      nonnegative_columns:
      - period_revenue
      - period_actual_cost
      - financing_interest_cost
      - closing_balance
      - period_debits
    marketing:
      date_column: reporting_month
      nonnegative_columns:
      - cumulative_output_value
      - cumulative_settlement
      - cumulative_collections
      - current_advance_funding
  metrics:
    sign_rate:
      unit: '%'
      formula: sum(Actual volume) / sum(Volume dispatched) × 100
      expression:
        op: multiply
        args:
        - op: divide
          args:
          - op: sum
            department: production
            measures:
            - signed_volume
          - op: sum
            department: production
            measures:
            - shipped_volume
        - op: constant
          value: 100
    leftover_rate:
      unit: '%'
      formula: (sum(Production volume) − sum(Volume dispatched)) / sum(Production volume) × 100
      expression:
        op: multiply
        args:
        - op: divide
          args:
          - op: subtract
            args:
            - op: sum
              department: production
              measures:
              - production_volume
            - op: sum
              department: production
              measures:
              - shipped_volume
          - op: sum
            department: production
            measures:
            - production_volume
        - op: constant
          value: 100
    volume_gap:
      unit: m³
      formula: sum(Procurement’s monthly production volume) − sum(Production’s production volume)
      expression:
        op: subtract
        args:
        - op: sum
          department: procurement
          measures:
          - material_volume
        - op: sum
          department: production
          measures:
          - production_volume
    material_cost_ratio:
      unit: '%'
      formula: sum(Monthly material cost) / sum(Period revenue) × 100
      expression:
        op: multiply
        args:
        - op: divide
          args:
          - op: sum
            department: procurement
            measures:
            - material_cost
          - op: sum
            department: finance
            measures:
            - revenue
        - op: constant
          value: 100
    weighted_unit_margin:
      unit: CNY/m³
      formula: sum(Monthly production volume × Gross margin per m³ excl. VAT) / sum(Monthly production volume)
      expression:
        op: divide
        args:
        - op: sum_product
          department: procurement
          measures:
          - material_volume
          - unit_margin
        - op: sum
          department: procurement
          measures:
          - material_volume
    net_margin:
      unit: '%'
      formula: sum(Project net profit) / sum(Period revenue) × 100
      expression:
        op: multiply
        args:
        - op: divide
          args:
          - op: sum
            department: finance
            measures:
            - net_profit
          - op: sum
            department: finance
            measures:
            - revenue
        - op: constant
          value: 100
    receivable_months:
      unit: months
      formula: sum(Closing receivable) / sum(Period invoiced (debits))
      expression:
        op: divide
        args:
        - op: sum
          department: finance
          measures:
          - closing_balance
        - op: sum
          department: finance
          measures:
          - period_debit
    settlement_collection_rate:
      unit: '%'
      formula: sum(Cumulative collections) / sum(Cumulative settlement) × 100
      expression:
        op: multiply
        args:
        - op: divide
          args:
          - op: sum
            department: marketing
            measures:
            - cumulative_receipts
          - op: sum
            department: marketing
            measures:
            - cumulative_settlement
        - op: constant
          value: 100
    advance_ratio:
      unit: '%'
      formula: sum(Current advance funding) / sum(Cumulative output value) × 100
      expression:
        op: multiply
        args:
        - op: divide
          args:
          - op: sum
            department: marketing
            measures:
            - advance
          - op: sum
            department: marketing
            measures:
            - cumulative_output
        - op: constant
          value: 100
    collection_gap:
      unit: CNY
      formula: sum(Gap), Gap = Cumulative settlement − Collection plan total (assumed convention)
      expression:
        op: sum
        department: marketing
        measures:
        - collection_gap
  roles:
    production:
      responsibility: Check dispatched against signed-off volume and production leftovers; propose truck checks
        and handling of returned material. May not find a customer in breach or change settled volumes.
      decision_owner: Production manager (simulated)
      constraints:
      - The sign-off rate is a company-level monthly total, not a finding about one project
      - A signed-off volume difference goes into settlement only after checking with Marketing and the site
      unsupported_topics: []
    procurement:
      responsibility: Check material cost as a share of revenue, weighted margin per m³, and whether the materials
        estimate matches actual production. May not change contract prices.
      decision_owner: Procurement manager (simulated)
      constraints:
      - Margin per m³ converts the price at 13% VAT; the rate is an assumed convention
      - When the estimate and production disagree, correct the estimate before comparing cost
      unsupported_topics: []
    finance:
      responsibility: Check project net margin and how many months of billing the receivables equal; propose profit
        and collection reviews. May not declare bad debt or book impairments.
      decision_owner: Finance director (simulated)
      constraints:
      - Receivable months is balance over this month’s billing, not ageing
      - Net profit after financing cost
      unsupported_topics:
      - Accrue
      - Impairment
      - Bad-debt probability
      - Credit exposure widening
      - Credit exposure narrowing
    marketing:
      responsibility: Check the collection rate on settlement, the advance funding ratio and the collection plan
        gap; propose collection and funding controls. May not change customer terms or credit.
      decision_owner: Sales director (simulated)
      constraints:
      - The gap is cumulative settlement minus the collection plan total, a convention the business has not confirmed
      - The advance funding ratio is company-level; see the Cross-department master for project differences
      unsupported_topics: []
  checks:
  - id: sign_rate
    owner: production
    metric: sign_rate
    attention_when: below
    threshold: 97
    title: On-site sign-off rate
    actions:
      attention:
      - Check low sign-off trucks and returned material by project
      ok:
      - Keep the current dispatch and sign-off process
  - id: leftover
    owner: production
    metric: leftover_rate
    attention_when: above
    threshold: 1
    title: Production leftover rate
    actions:
      attention:
      - Check leftover disposal and metering error
      ok:
      - Keep recording leftovers per truck
  - id: volume_gap
    owner: procurement
    metric: volume_gap
    attention_when: above
    threshold: 0
    title: Materials estimate vs production volume
    actions:
      attention:
      - Correct the materials estimate to actual output
      ok:
      - Record that the estimate and production agree
  - id: material_cost
    owner: procurement
    metric: material_cost_ratio
    attention_when: above
    threshold: 85
    title: Material cost share of revenue
    actions:
      attention:
      - Review material prices and mix design
      ok:
      - Keep tracking this month’s delivered prices
  - id: unit_margin
    owner: procurement
    metric: weighted_unit_margin
    attention_when: below
    threshold: 60
    title: Weighted gross margin per m³
    actions:
      attention:
      - Submit low-margin projects for a price review
      ok:
      - Keep the current mix design and purchase prices
  - id: net_margin
    owner: finance
    metric: net_margin
    attention_when: below
    threshold: 3
    title: Project net margin
    actions:
      attention:
      - Start a joint cost and price review
      ok:
      - Record the net margin and track it monthly
  - id: receivable_months
    owner: finance
    metric: receivable_months
    attention_when: above
    threshold: 3
    title: Receivables in months of billing
    actions:
      attention:
      - Review each project’s collection plan and inform Marketing
      ok:
      - Track at the current collection pace
  - id: collection_rate
    owner: marketing
    metric: settlement_collection_rate
    attention_when: below
    threshold: 80
    title: collection_rate_on_settlement
    actions:
      attention:
      - Draw up a collection plan for low-collection projects
      ok:
      - Follow up collections by contract milestone
  - id: advance
    owner: marketing
    metric: advance_ratio
    attention_when: above
    threshold: 30
    title: advance_funding_ratio
    actions:
      attention:
      - Pause new advance funding and reconcile financing with Finance
      ok:
      - Keep the current advance funding limit
  - id: collection_gap
    owner: marketing
    metric: collection_gap
    attention_when: above
    threshold: 0
    title: Collection plan gap
    actions:
      attention:
      - Complete the collection plan and name an owner
      ok:
      - Collection plan covers the settled amount
  charts:
  - id: sign_rate_trend
    kind: trend
    metric: sign_rate
    periods: 6
    threshold_from_check: sign_rate
  - id: net_margin_trend
    kind: trend
    metric: net_margin
    periods: 6
    threshold_from_check: net_margin
  - id: output_variance
    kind: variance
    field: production_actual_volume
  - id: project_output_bars
    kind: entity_bars
    field: production_actual_volume
    top: 8
  brief:
    key_metrics:
    - net_margin
    - material_cost_ratio
    - settlement_collection_rate
    - receivable_months
    - sign_rate
    severity:
    - net_margin
    - collection_gap
    - material_cost
    - receivable_months
    - advance
    - collection_rate
    - unit_margin
    - volume_gap
    - sign_rate
    - leftover
    conventions:
      collection_gap:
      - marketing_gap
      weighted_unit_margin:
      - VAT rate
  manager_decision: Production checks the sign-off difference, Procurement confirms the estimate and margin, Finance
    reviews profit and receivables, Marketing follows up collections and advance funding. This report changes no
    settlement, price or credit by itself.
  limitations:
  - Simulated concrete supplier data, demonstrating the monthly reconciliation of the business’s v2 templates; not
    a real business conclusion
  - Metrics are company-level monthly totals; for project-level checks and cross-department consistency see the
    Cross-department master
  - VAT 13%, the gap formula and the diagnosis thresholds are common-practice conventions the business has not confirmed
    yet
  - No bad-debt, impairment or customer credit rating judgements
quotation:
  title: Ready-mix concrete quote draft
  description: Simulated sample. The price band is computed from the enquiry, cost and capacity evidence under the
    pricing and credit policy, checking capacity, lead time, collections and payment terms; nothing goes out without
    the approver the policy names.
  roles:
    marketing:
      responsibility: Records the customer’s needs and terms and quotes as approved; never promises a price or payment
        terms alone.
      decision_owner: Sales director (simulated)
    procurement:
      responsibility: Computes material cost from this month’s delivered prices and the mix design; supplies the
        transport, pumping and production cost basis.
      decision_owner: Procurement manager (simulated)
    production:
      responsibility: Confirms available capacity and the new project lead time.
      decision_owner: Production manager (simulated)
    finance:
      responsibility: Checks the customer’s collection history and sets the credit grade and financing cost.
      decision_owner: Finance director (simulated)
    management:
      responsibility: Approves quotes below the floor price or with payment terms below the credit grade’s minimum.
      decision_owner: General manager (simulated)
  inputs:
    order_volume:
      title: Expected total volume
      unit: m³
      owner: marketing
      exclusive_minimum: 0
    peak_monthly_volume:
      title: Peak monthly demand
      unit: m³/month
      owner: marketing
      exclusive_minimum: 0
    requested_price:
      title: Customer’s target unit price incl. VAT
      unit: CNY/m³
      owner: marketing
      exclusive_minimum: 0
    requested_payment_ratio:
      title: Next-month payment ratio the customer asks for
      unit: ratio
      owner: marketing
      minimum: 0
    requested_first_pour_days:
      title: Days to first pour
      unit: days
      owner: marketing
      exclusive_minimum: 0
    material_cost:
      title: Mix material cost (excl. VAT)
      unit: CNY/m³
      owner: procurement
      minimum: 0
    processing_cost:
      title: Transport, pumping and production costs
      unit: CNY/m³
      owner: procurement
      minimum: 0
    available_capacity:
      title: Plant capacity available
      unit: m³/month
      owner: production
      minimum: 0
    preparation_days:
      title: New project lead time
      unit: days
      owner: production
      minimum: 0
    payment_days:
      title: Average historical collection days
      unit: days
      owner: finance
      minimum: 0
    capital_cost:
      title: Financing cost
      unit: CNY/m³
      owner: finance
      minimum: 0
  metrics:
    unit_cost:
      title: Cost per m³ (excl. VAT)
      unit: CNY/m³
      formula: material_cost + processing_cost + capital_cost
      expression:
        op: add
        args:
        - op: add
          args:
          - op: input
            key: material_cost
          - op: input
            key: processing_cost
        - op: input
          key: capital_cost
    floor_price:
      title: Floor price incl. VAT (15 CNY/m³ margin)
      unit: CNY/m³
      formula: ceil_currency((unit_cost + 15) × 1.13)
      expression:
        op: multiply
        args:
        - op: add
          args:
          - op: metric
            key: unit_cost
          - op: constant
            value: '15'
        - op: constant
          value: '1.13'
      rounding:
        places: 2
        mode: ceiling
    target_price:
      title: Target price incl. VAT (30 CNY/m³ margin)
      unit: CNY/m³
      formula: ceil_currency((unit_cost + 30) × 1.13)
      expression:
        op: multiply
        args:
        - op: add
          args:
          - op: metric
            key: unit_cost
          - op: constant
            value: '30'
        - op: constant
          value: '1.13'
      rounding:
        places: 2
        mode: ceiling
    stretch_price:
      title: Stretch price incl. VAT (40 CNY/m³ margin)
      unit: CNY/m³
      formula: ceil_currency((unit_cost + 40) × 1.13)
      expression:
        op: multiply
        args:
        - op: add
          args:
          - op: metric
            key: unit_cost
          - op: constant
            value: '40'
        - op: constant
          value: '1.13'
      rounding:
        places: 2
        mode: ceiling
    customer_price:
      title: Customer’s target unit price incl. VAT
      unit: CNY/m³
      formula: requested_price
      expression:
        op: input
        key: requested_price
    target_total:
      title: Target price total (incl. VAT)
      unit: CNY
      formula: target_price × order_volume
      expression:
        op: multiply
        args:
        - op: metric
          key: target_price
        - op: input
          key: order_volume
      rounding:
        places: 2
        mode: half_up
    peak_demand:
      title: Peak monthly demand
      unit: m³/month
      formula: peak_monthly_volume
      expression:
        op: input
        key: peak_monthly_volume
    capacity:
      title: Capacity available
      unit: m³/month
      formula: available_capacity
      expression:
        op: input
        key: available_capacity
    payment_days_verified:
      title: Average historical collection days
      unit: days
      formula: payment_days
      expression:
        op: input
        key: payment_days
    payment_ratio:
      title: Next-month payment ratio
      unit: ratio
      formula: requested_payment_ratio
      expression:
        op: input
        key: requested_payment_ratio
    first_pour_days:
      title: Days to first pour
      unit: days
      formula: requested_first_pour_days
      expression:
        op: input
        key: requested_first_pour_days
    preparation:
      title: Lead time
      unit: days
      formula: preparation_days
      expression:
        op: input
        key: preparation_days
  checks:
  - id: below_floor
    title: The customer’s target price is below the floor; quoting needs the general manager’s approval
    owner: management
    metric: customer_price
    attention_when: below
    threshold_metric: floor_price
    block_on_attention: false
  - id: below_target
    title: The customer’s target price is below target; quoting needs the sales director’s approval
    owner: marketing
    metric: customer_price
    attention_when: below
    threshold_metric: target_price
    block_on_attention: false
  - id: capacity
    title: Peak monthly demand exceeds capacity; Production must reschedule before quoting
    owner: production
    metric: peak_demand
    attention_when: above
    threshold_metric: capacity
    block_on_attention: true
  - id: credit_grade_c
    title: Collections have taken over 75 days (grade C); cash before delivery or the finance director’s approval
    owner: finance
    metric: payment_days_verified
    attention_when: above
    threshold: 75
    block_on_attention: true
  - id: payment_ratio
    title: The payment ratio is below grade B’s 70% minimum; needs the general manager’s approval
    owner: management
    metric: payment_ratio
    attention_when: below
    threshold: '0.70'
    block_on_attention: true
  - id: lead_time
    title: The lead time is longer than the time to first pour; renegotiate the supply date
    owner: production
    metric: preparation
    attention_when: above
    threshold_metric: first_pour_days
    block_on_attention: true
  outputs:
  - unit_cost
  - floor_price
  - target_price
  - stretch_price
  - customer_price
  - target_total
  - payment_ratio
  manager_decision: Internal quote draft. Below the floor price needs the general manager; between floor and target
    needs the sales director. Nothing goes out before approval, and sending it needs a native approval for this
    quote.
