  引导教程使用的样例。生产部把一个客户写成了简称，其余都对得上。: The sample the guided tour uses. Production shortened one customer's name; everything else ties.
  客户简称、按计划量而非实际量测算、金额栏填了文字、市场部漏报一个项目——几类待办同时出现。: >-
    A shortened customer name, a quantity taken from the plan, text in a money field and a project marketing
    left out — several kinds of open item together.
  混入一条 6 月的记录、一个负数产量、市场部把「累计收款」写成了「累计回款」、物资部删掉了模板里的必需列。: &renamed >-
    A June row mixed in, a negative quantity, marketing renamed Cumulative collections to Collections to date,
    and procurement deleted a required template column.
  A June row mixed in, a negative quantity, marketing renamed 累计收款 to 累计回款, and procurement deleted a required template column.: *renamed
  四个部门的数据全部对得上，没有待办，所有指标都在关注阈值以内。: All four departments tie, nothing is open, and every metric is inside its threshold.

