  月结30天: Monthly, net 30
  按月结算按比例付款: Monthly settlement, paid by ratio
  水泥月结，次月15日前付清: Cement settled monthly, paid by the 15th of the next month
  水泥月结，次月15日前付清；外加剂季度结算: Cement settled monthly, paid by the 15th of the next month; admixtures settled quarterly
  水泥月结，次月15日前付清；砂石款到发货: Cement settled monthly, paid by the 15th of the next month; sand and aggregate cash before delivery
  水泥预付30%，到货后月结: Cement 30% prepaid, the rest monthly after delivery
  按月结算，次月25日前支付当月结算额的80%，主体封顶后付至90%，竣工结算后付至97%，余3%质保金满一年付清: >-
    Monthly settlement: 80% of the month's settlement by the 25th of the next month, up to 90% at topping-out,
    97% at final settlement, the 3% retention after one year
  按月结算，次月底前支付当月结算额的80%，竣工验收后付至95%，余5%质保金两年内付清: >-
    Monthly settlement: 80% of the month's settlement by the end of the next month, up to 95% at completion
    acceptance, the 5% retention within two years
  按月结算，次月支付当月结算额的80%，竣工后三个月内付至97%: >-
    Monthly settlement: 80% of the month's settlement the next month, up to 97% within three months of completion
  按月结算，结算后60日内支付70%，工程决算审计完成后付至95%: >-
    Monthly settlement: 70% within 60 days of settlement, up to 95% once the final account audit is done

  # Review metric formulas, as the review shows them
  (sum(生产量) − sum(出厂量)) / sum(生产量) × 100: (sum(Production volume) − sum(Volume dispatched)) / sum(Production volume) × 100
  sum(实际量) / sum(出厂量) × 100: sum(Actual volume) / sum(Volume dispatched) × 100
  sum(应收期末余额) / sum(本期借方开票额): sum(Closing receivable) / sum(Period invoiced (debits))
  sum(当前垫资额) / sum(累计产值) × 100: sum(Current advance funding) / sum(Cumulative output value) × 100
  sum(当月物资总成本) / sum(本期实现收入) × 100: sum(Monthly material cost) / sum(Period revenue) × 100
  sum(当月生产量 × 单方不含税毛利) / sum(当月生产量): sum(Monthly production volume × Gross margin per m³ excl. VAT) / sum(Monthly production volume)
  sum(物资部当月生产量) − sum(生产部生产量): sum(Procurement’s monthly production volume) − sum(Production’s production volume)
  sum(累计收款) / sum(累计结算) × 100: sum(Cumulative collections) / sum(Cumulative settlement) × 100
  sum(缺口)，缺口 = 累计结算 − 收款计划合计（口径假设）: sum(Gap), Gap = Cumulative settlement − Collection plan total (assumed convention)
  sum(项目财务净利润) / sum(本期实现收入) × 100: sum(Project net profit) / sum(Period revenue) × 100

