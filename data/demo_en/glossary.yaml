# The words of the English sample set that data/company_templates/labels.en.yaml does not
# already give, and the few places a sample needs a different word from the interface's.
# scripts/make_english_samples.py reads labels.en.yaml first, then this file on top of it.
#
# Everything here is fictional sample data: companies, projects, people and plants do not
# exist. Translate meaning, keep every number, code and unit exactly as written.
terms:
  # Overrides of labels.en.yaml, where one English word would otherwise stand for two things
  客户: Client                      # an alias beside 客户单位 (Customer)
  累计回款: Collections to date      # the renamed column in the "different problems" case
  月: months                        # a unit here; 月份 is the month field

  # Header spellings the templates carry as written
  "  材料含量": "  Material content"

