        dtype: date
        aliases:
        - Ticket date
        formats:
        - '%Y/%m/%d'
        - '%Y.%m.%d'
        - '%d %b %Y'
      customer:
        label: Customer
        aliases:
        - Client
      project:
        label: Project name
        aliases:
        - Job
      product:
        label: Item name
        aliases:
        - Product
      output_qty:
        label: Production volume
        dtype: number
        aliases:
        - Output
        unit: m3
        units:
          m³: m3
          m3: m3
        minimum: 0
      shipped_qty:
        label: Volume dispatched
        dtype: number
        aliases:
        - Dispatched
        unit: m3
        units:
          m³: m3
          m3: m3
        minimum: 0
