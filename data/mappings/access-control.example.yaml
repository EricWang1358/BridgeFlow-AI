# 访问控制：哪个登录用户可以访问哪些部门的数据源。
#
# 谁来写这个文件：人，事先。与字段字典同一条规则——映射由人声明，不由模型推断。
# 键是飞书 union_id（登录门户签发的 JWT 里的 sub）。
#
# 未列出的用户看不到任何批次；文件缺失或非法时服务明确报「未配置」（503），
# 绝不退回猜测。可见性规则：批次的部门集合 ⊆ 用户授权部门，或批次由该用户导入。
users:
  ou_example_union_id:
    name: 示例用户
    departments: [production, procurement, finance, marketing]
