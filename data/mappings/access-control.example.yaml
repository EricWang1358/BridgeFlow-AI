# 访问控制：哪个登录用户可以访问哪些部门的数据源。
#
# 谁来写这个文件：人，事先。与字段字典同一条规则——映射由人声明，不由模型推断。
# 键是飞书 union_id（登录门户签发的 JWT 里的 sub）。
#
# 未列出的用户看不到任何批次；文件缺失或非法时服务明确报「未配置」（503），
# 绝不退回猜测。可见性规则：批次的部门集合 ⊆ 用户授权部门，或批次由该用户导入。
users:
  ou_example_union_id:
    name: 示例用户
    departments: [production, procurement, finance, marketing]
    # Exact workflow catalogue department labels. Separate from the fixed import
    # department IDs above: no automatic translation or inferred permission.
    # Missing list means no workflow data access once portal identity is enabled.
    workflow_departments: [生产部, 市场部]
    # Explicit operation grants; omitted means read-only. Grant only required actions.
    operations: [batch_import, review_note]
    # Native approved writes additionally accept: confirm_mapping, confirm_column_match,
    # quarantine_decide, quarantine_apply, workflow_record, workflow_approve_submit,
    # workflow_handoff, feishu_import, feishu_upload_report, discovery_propose, discovery_register, discovery_graph_save, discovery_score_save, discovery_meeting_save.
    # MVP decisions: discovery_decision_propose, discovery_decision_vote,
    # discovery_decision_resolve, discovery_decision_finalize; declared policy roles also required.
    # Data scope and native approval are still required; a grant alone cannot write.
    # discovery_upload allows staging files only; discovery_register additionally needs native approval.
