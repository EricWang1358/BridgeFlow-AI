# 示例字段字典。真实内容等 OA 字段导出后填写，见本目录 README.md。
# 启用方式：复制为 field-dictionary.yaml，或设置 FIELD_DICTIONARY_PATH。
#
# 注意：columns 段一旦非空，系统就完全按声明走，不再用列名关键词猜测。

columns:
  production:
    sku: sku
    line: capacity_unit
  procurement:
    material: raw_material
  finance:
    gl_account: gl_account
    customer: customer
  marketing:
    customer: customer
    product: sku

relations:
  # SKU 与原料的关系只有物料清单知道，推断不出来。
  - source: sku:sku-a1
    target: raw_material:rm-alu-6061
    relation: consumes
    note: 示例，非真实 BOM

  - source: sku:sku-b7
    target: raw_material:rm-steel-304
    relation: consumes
    note: 示例，非真实 BOM

  - source: sku:sku-a1
    target: gl_account:4000-sales-a1
    relation: books_to
    note: 示例，非真实科目对照

# 度量字段：哪一列可以被加总。
#
# columns 段说的是"这一行讲的是什么"（SKU、客户、原料）；measures 段说的是
# "什么可以被算"。指标需要后者，而把列名写进 Python 就等于把客户的表结构写死——
# 真实字段还在与公司协商中。见 CLAUDE.md 第八条硬约束。
#
# 注意列名是 sanitizer 归一之后的形态（snake_case），不是表头原文。
measures:
  production:
    output_qty: output_quantity
    capacity_hrs: capacity_hours
  procurement:
    # 单价是「每一单位多少钱」，不是金额。这里曾写成 purchase_amount，于是
    # material_spend 把一整列单价加起来当支出：2025-11 报出 13,540，而三张填了价的
    # PO 实际是 117,250。被引用的每个单元格都是真的，数字仍然是错的——
    # 「结论必须带证据」保证的是数字来自单元格，不保证公式有意义。
    unit_price: unit_price
    qty: purchase_quantity
  finance:
    amount: revenue_amount
    ar_days: receivable_days
# 派生量：表里没有这一列，但它由表里有的列算出来。
#
# 支出 = 单价 × 数量，逐行相乘再求和。写成声明而不是写死在 Python 里，理由和
# measures 段一样：「哪两列相乘等于金额」属于客户的表结构，还在协商中
# （CLAUDE.md 第八条硬约束）。
#
# 只加填全的那几行会把这个月报小，所以某一行有数量、没单价时 material_spend
# **整条拒绝**并点名那一行：未知不是零。实现见 metrics._spend。
#
# 表里本来就有金额列时不需要这一段——声明在 measures 里即可，那条路优先
# （客户自己写下的数才是能签字的数）。见 electronics 示例的 po_value: purchase_amount。
derived:
  purchase_amount:
    product: [unit_price, purchase_quantity]

# 各度量的月度合并方式。
#
# 数量求和、单价取平均、库存取期末值——**选错了会得到一个看起来合理的数字**，
# 所以这是声明的，不是猜的。缺省是 sum。
rollups:
  output_quantity: sum
  capacity_hours: sum
  purchase_amount: sum
  purchase_quantity: sum
  revenue_amount: sum
  receivable_days: average
