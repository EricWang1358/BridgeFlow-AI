# 示例字段字典。真实内容等 OA 字段导出后填写，见本目录 README.md。
# 启用方式：复制为 field-dictionary.yaml，或设置 FIELD_DICTIONARY_PATH。
#
# 注意：columns 段一旦非空，系统就完全按声明走，不再用列名关键词猜测。

columns:
  production:
    sku: sku
    line: capacity_unit
  procurement:
    material: raw_material
  finance:
    gl_account: gl_account
    customer: customer
  marketing:
    customer: customer
    product: sku

relations:
  # SKU 与原料的关系只有物料清单知道，推断不出来。
  - source: sku:sku-a1
    target: raw_material:rm-alu-6061
    relation: consumes
    note: 示例，非真实 BOM

  - source: sku:sku-b7
    target: raw_material:rm-steel-304
    relation: consumes
    note: 示例，非真实 BOM

  - source: sku:sku-a1
    target: gl_account:4000-sales-a1
    relation: books_to
    note: 示例，非真实科目对照
