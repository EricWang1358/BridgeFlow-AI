# 示例字段字典。真实内容等 OA 字段导出后填写，见本目录 README.md。
# 启用方式：复制为 field-dictionary.yaml，或设置 FIELD_DICTIONARY_PATH。
#
# 注意：columns 段一旦非空，系统就完全按声明走，不再用列名关键词猜测。

columns:
  production:
    sku: sku
    line: capacity_unit
  procurement:
    material: raw_material
  finance:
    gl_account: gl_account
    customer: customer
  marketing:
    customer: customer
    product: sku

relations:
  # SKU 与原料的关系只有物料清单知道，推断不出来。
  - source: sku:sku-a1
    target: raw_material:rm-alu-6061
    relation: consumes
    note: 示例，非真实 BOM

  - source: sku:sku-b7
    target: raw_material:rm-steel-304
    relation: consumes
    note: 示例，非真实 BOM

  - source: sku:sku-a1
    target: gl_account:4000-sales-a1
    relation: books_to
    note: 示例，非真实科目对照

# 度量字段：哪一列可以被加总。
#
# columns 段说的是"这一行讲的是什么"（SKU、客户、原料）；measures 段说的是
# "什么可以被算"。指标需要后者，而把列名写进 Python 就等于把客户的表结构写死——
# 真实字段还在与公司协商中。见 CLAUDE.md 第八条硬约束。
#
# 注意列名是 sanitizer 归一之后的形态（snake_case），不是表头原文。
measures:
  production:
    output_qty: output_quantity
    capacity_hrs: capacity_hours
  procurement:
    unit_price: purchase_amount
    qty: purchase_quantity
  finance:
    amount: revenue_amount
    ar_days: receivable_days

# 各度量的月度合并方式。
#
# 数量求和、单价取平均、库存取期末值——**选错了会得到一个看起来合理的数字**，
# 所以这是声明的，不是猜的。缺省是 sum。
rollups:
  output_quantity: sum
  capacity_hours: sum
  purchase_amount: sum
  purchase_quantity: sum
  revenue_amount: sum
  receivable_days: average
