# The demo cases a person can open from "Open sample notebook". All are the same fictional
# concrete supplier in 2024-07 under the retained sample dictionary; they differ in what is
# wrong, because one batch cannot show every state at once. Generated by
# scripts/make_demo_cases.py (except `tour`, the retained guided-tour sample).
dictionary: data/mock_business/demo/dictionary.yaml
period: "2024-07"
# What each imported sample file is called; {department} is the department label the
# integration declaration gives, {period} the month.
file_name: 模拟-{department}-{period}.xlsx
# Earlier months of the same supplier, nothing planted. "Load the earlier sample months"
# imports the ones not already present, so trends have more than one point.
history:
  - {period: "2024-05", folder: data/mock_business/cases/history/2024-05, case_id: demo-history-2024-05}
  - {period: "2024-06", folder: data/mock_business/cases/history/2024-06, case_id: demo-history-2024-06}
cases:
  tour:
    folder: data/mock_business/demo
    case_id: mock-company-2024-07
    title: [引导样例：一处跨部门不一致, "Guided sample: one cross-department mismatch"]
    summary: [引导教程使用的样例。生产部把一个客户写成了简称，其余都对得上。, "The sample the guided tour uses. Production shortened one customer's name; everything else ties."]
  core:
    folder: data/mock_business/cases/core
    case_id: demo-core-2024-07
    title: [多问题并发：很多问题同时出现, "Many problems at once"]
    summary: [客户简称、按计划量而非实际量测算、金额栏填了文字、市场部漏报一个项目——几类待办同时出现。, "A shortened customer name, a quantity taken from the plan, text in a money field and a project marketing left out — several kinds of open item together."]
  other:
    folder: data/mock_business/cases/other
    case_id: demo-other-2024-07
    title: [另一类问题：与上一套不重叠, "A different set of problems"]
    summary: [混入一条 6 月的记录、一个负数产量、市场部把「累计收款」写成了「累计回款」、物资部删掉了模板里的必需列。, "A June row mixed in, a negative quantity, marketing renamed 累计收款 to 累计回款, and procurement deleted a required template column."]
  clean:
    folder: data/mock_business/cases/clean
    case_id: demo-clean-2024-07
    title: [全对：可以直接研判, "All clear: ready to review"]
    summary: [四个部门的数据全部对得上，没有待办，所有指标都在关注阈值以内。, "All four departments tie, nothing is open, and every metric is inside its threshold."]
