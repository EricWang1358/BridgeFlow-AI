    - {id: lead_time, title: 准备周期长于客户首次浇筑时间，须重新协商供货日, owner: production, metric: preparation, attention_when: above, threshold_metric: first_pour_days, block_on_attention: true}
  outputs: [unit_cost, floor_price, target_price, stretch_price, customer_price, target_total, payment_ratio]
