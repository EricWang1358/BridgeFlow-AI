# Take the shells and the editor away from the runtime.
#
# WHY
# ---
# Untrusted spreadsheet cell content reaches the model (semantic_resolver passes
# row_support derived from it; evaluator splices cells in raw). The sdk-minimal
# bundle hands that model a bash with no directory confinement, so the sink for a
# planted instruction is a shell in the developer's checkout, not a wrong answer.
#
# Sandboxing does not close this. SandboxMode governs filesystem *writes* only —
# read-only denies writes and says nothing about reads, and network and process
# visibility are outside its vocabulary. Permission presets do not
# help either: they bundle sandbox mode and approval policy, and decide nothing
# about which tools exist.
#
# Taking the tools away does close it. Measured on one adjudication:
#
#            without this patch        with it
#   tools    3-12 bash calls           0
#   input    ~7,100 tokens of files    0
#   time     12-212s                   5.9s
#   verdict  0.99, copied out of       0.20, reasoned from the prompt,
#            test_resolver.py          and correct to be unsure
#
# The model was reading the test file to answer the question. Removing the shell
# removed the contamination as well as the cost.
#
# HOW
# ---
# A patch layer is applied after every bundle layer, so this needs no fork of dsh
# and no rebuilt profile — see docs/architecture.md: the official runtime is not forked.
#
# A wrong package name is not silently ignored, but it is easy to scroll past: the
# runtime prints `patch: name mismatch for "<id>" ... skipping` and carries on with
# the tool still enabled. Read the boot output rather than assuming the patch took.
#
# A patch entry must be complete enough to read as an override rather than a
# fragment: `disabled: true` alone silently does nothing on an entry whose base
# config does not already declare `disabled`, which is why str-replace-editor
# survived the first version of this file. Carrying `name` and `config` makes the
# override take. Verify with:
#
#   dsh --profile sdk-minimal --patch dsh/no-shell.patch.yml --dump-config \
#     | grep -A3 '^- id: str-replace-editor$'
- id: persistent-bash
  name: '@deepseek-ai/dsh-tool-bash-persistent'
  disabled: true
  config: {}
- id: persistent-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh-persistent'
  disabled: true
  config: {}
- id: str-replace-editor
  name: '@deepseek-ai/dsh-tool-str-replace-editor'
  disabled: true
  config: {}
