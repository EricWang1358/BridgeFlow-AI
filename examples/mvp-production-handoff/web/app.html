<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BridgeFlow · 生产交接 MVP</title><style>
:root{color-scheme:light dark;--bg:light-dark(#f5f7f9,#13181e);--panel:light-dark(#fff,#1d252e);--ink:light-dark(#182d39,#e1edf3);--muted:light-dark(#596d78,#a5b7c1);--line:light-dark(#dce4e8,#384750);--accent:light-dark(#09685e,#76daca);--soft:light-dark(#e5f4f0,#173a35)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,sans-serif}header{padding:26px 5vw;background:var(--panel);border-bottom:1px solid var(--line)}h1{font-size:28px;margin:5px 0}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px}p{margin:8px 0}nav,.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}nav{margin-top:18px}button,a.button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer;text-decoration:none}button.primary,nav button[aria-selected=true]{background:var(--accent);color:light-dark(#fff,#122d27);border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}main{max-width:1260px;margin:22px auto;padding:0 22px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px}.muted{color:var(--muted)}.notice{border-left:3px solid var(--accent);padding:10px 14px;background:var(--soft);margin:12px 0}.layout{display:grid;grid-template-columns:275px 1fr;gap:18px}.stack{display:grid;gap:10px}.record{width:100%;text-align:left}.record.selected{border-color:var(--accent);background:var(--soft)}.tag{padding:2px 8px;border-radius:5px;background:var(--soft);color:var(--accent);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}label{display:block;color:var(--muted)}input,textarea,select{font:inherit;width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}input[type=checkbox]{width:auto}textarea{min-height:65px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}th{font-weight:500;color:var(--muted)}.scroll{overflow:auto}details{margin:12px 0}summary,a{color:var(--accent)}summary{cursor:pointer}.timeline{padding-left:18px;border-left:2px solid var(--line);margin:12px 0}.timeline p{font-size:14px;overflow-wrap:anywhere}.step{padding:14px;background:var(--soft);border-radius:8px}.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.toast{position:sticky;top:0;z-index:1;padding:12px 22px;background:var(--panel);border-bottom:1px solid var(--line)}footer{max-width:1260px;margin:auto;padding:12px 22px;color:var(--muted);font-size:13px}[hidden]{display:none!important}@media(max-width:760px){.layout{grid-template-columns:1fr}.grid,.flow{grid-template-columns:1fr 1fr}header{padding:20px}main{padding:0 14px}.panel{padding:16px}}@media(max-width:440px){.grid,.flow{grid-template-columns:1fr}}
</style><header><small>BRIDGEFLOW / WORKFLOW PILOT 02</small><h1>从生产填报，到市场部接收</h1><p class="muted">一个项目 · 一条记录 · 可追溯的标准化与部门交接</p><div class="notice">本地交互演示：规则代替模型；通知为模拟。部门切换不是身份认证，请仅使用合成或获准脱敏样例。</div><nav aria-label="工作区"><button data-tab="plan" aria-selected="false">1 · 流程与字典</button><button data-tab="work" aria-selected="true">2 · 填报与流转</button><button data-tab="consult" aria-selected="false">3 · 落地建议</button></nav></header><div id="message" class="toast" role="status" hidden></div><main><section id="plan" hidden></section><section id="work"></section><section id="consult" hidden></section></main><footer>数据保存在本机 SQLite。刷新可恢复记录；图片 OCR、真实模型、企业权限和真实消息平台尚未接入。</footer>
<script>
let state={},active=null,tab='work',role='生产部';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={draft:'待补充 / 待复核',pending_market:'待市场部处理',market_processing:'市场部处理中',returned:'已退回生产部',completed:'已完成'};const notices={not_created:'尚未生成',pending:'待发送',failed:'模拟发送失败',simulated_sent:'模拟发送完成'};
function say(text){$('message').hidden=false;$('message').textContent=text}
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Demo-Token':state.token},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'操作失败');return j}
async function refresh(){const r=await fetch('/api/state');if(!r.ok)throw Error('无法读取本地服务');state=await r.json();if(!active&&state.docs.length)active=state.docs[0].id;render()}
function doc(){return state.docs.find(x=>x.id===active)}
function fieldTable(d){return `<div class="scroll"><table><thead><tr><th>标准字段</th><th>值</th><th>来源 / 确认依据</th></tr></thead><tbody>${state.template.fields.map(f=>{let s=d.checked.sources[f.name];return `<tr><td>${esc(f.name)}</td><td>${esc(d.checked.values[f.name]||'待补充')}</td><td>${esc(s?`${s.source_field}：${s.original_value??''}${s.note?'；'+s.note:''}`:'未提供')}</td></tr>`}).join('')}</tbody></table></div>`}
function renderPlan(){const fields=state.template.fields;$('plan').innerHTML=`<div class="panel"><h2>Agent 1 的交接输入 · 演示设定</h2><p>${esc(state.template.scope)}</p><div class="flow"><div class="step">生产部<br>提交原始记录</div><div class="step">标准化<br>补问、校验与复核</div><div class="step">数据就绪<br>本地入库、模拟通知</div><div class="step">市场部<br>接收、核对或退回</div></div><p class="muted">一线模板试点与公司投票尚未发生。m³、日期归属、部门路由均为本案例假设。</p></div><div class="panel"><h2>标准输入 / 输出字典</h2><p>版本 ${esc(state.template.version)} · 来源：生产部.xlsx 的 11 个表头</p><div class="scroll"><table><thead><tr><th>字段</th><th>含义 / 规则</th><th>异名输入</th><th>必填</th></tr></thead><tbody>${fields.map(f=>`<tr><td>${esc(f.name)}</td><td>${esc(f.definition)} ${esc(f.unit)}</td><td>${esc(f.aliases.join('、'))}</td><td>${f.required?'是':'否'}</td></tr>`).join('')}</tbody></table></div><p>派生提示：出厂量 − 实际量。只显示差异，不猜原因、不自动覆盖原值。</p></div>`}
function renderWork(){let d=doc();$('work').innerHTML=`<div class="layout"><aside><div class="panel"><h2>创建试点记录</h2><p class="muted">先用内置样例走一遍，再尝试单条 CSV、JSON 或 XLSX。</p><div class="stack"><button id="sample" class="primary">载入缺失字段样例</button><label>上传单条记录<input id="file" type="file" accept=".csv,.json,.xlsx"></label><a href="/sample.csv" download="生产部演示输入.csv">下载合成 CSV 样例</a></div></div><div class="panel"><h3>记录 · ${state.docs.length}</h3><div class="stack">${state.docs.map(x=>`<button class="record ${x.id===active?'selected':''}" data-id="${x.id}">${esc(x.checked.values['项目名称']||'未命名项目')}<br><small>${esc(x.id)} · v${x.version} · ${esc(names[x.state])}</small></button>`).join('')||'<p class="muted">还没有记录。</p>'}</div></div></aside><div>${d?detail(d):'<div class="panel"><h2>从一条生产记录开始</h2><p>点击“载入缺失字段样例”。系统会识别出缺少实际量，等你补充后再继续。</p><p>演示答复可以填写：实际量 97.5，依据“演示确认记录”。</p></div>'}</div></div>`;
$('sample').onclick=async()=>{try{const j=await api('/api/create',{sample:true});active=j.doc.id;await refresh();say('已载入合成样例。请查看缺失项。')}catch(e){say(e.message)}};
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>1024*1024)return say('文件上限 1 MB');let reader=new FileReader();reader.onload=async()=>{try{let j=await api('/api/create',{filename:f.name,data:reader.result.split(',')[1]});active=j.doc.id;await refresh();say('文件已读取并校验。')}catch(e){say(e.message)}};reader.readAsDataURL(f)};
document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{active=b.dataset.id;renderWork()});if(!d)return;
$('role').onchange=e=>{role=e.target.value;renderWork()};
state.template.fields.forEach((f,i)=>{const input=$('f'+i);if(input)input.addEventListener('input',()=>{if($('act-approve'))$('act-approve').disabled=true;if($('act-submit'))$('act-submit').disabled=true;})});
for(const action of ['patch','approve','submit','retry','accept','return','complete']){let b=$('act-'+action);if(b)b.onclick=async()=>{b.disabled=true;try{let p={version:d.version,note:$('note')?.value||''};if(action==='patch')p.values=Object.fromEntries(state.template.fields.map((f,i)=>[f.name,$('f'+i).value]));if(action==='submit')p.simulate_notification_failure=$('fail')?.checked||false;await api(`/api/docs/${d.id}/${action}`,p);await refresh();say({patch:'已保存修改，当前版本需要重新复核。',approve:'演示复核已保存，可以提交。',submit:'标准数据已入库。请查看通知与部门状态。',retry:'模拟通知重试成功，未重复入库。',accept:'市场部已接收。',return:'已退回；生产部修改后须重新复核提交。',complete:'市场部处理已完成，时间线已保存。'}[action])}catch(e){say(e.message);b.disabled=false}}}
}
function detail(d){let editable=['draft','returned'].includes(d.state),isProd=role==='生产部',c=d.checked;let issues=[...c.missing.map(n=>'缺少 '+n),...c.errors];return `<div class="panel"><div class="row"><h2>${esc(c.values['项目名称']||'试点记录')}</h2><span class="tag">${esc(names[d.state])}</span></div><p class="muted">${esc(d.id)} · v${d.version} · ${esc(d.filename)}</p><div class="grid"><div>标准数据<br><strong>${d.receipt?'已入库':'尚未入库'}</strong></div><div>通知通道<br><strong>${esc(notices[d.notification])}</strong></div><div>当前接收方<br><strong>${editable?'生产部补充/复核':d.state==='completed'?'本次交接已完成':'市场部'}</strong></div></div>${d.receipt?`<p class="muted">存放位置：${esc(d.receipt.target)} · 入库版本 v${d.receipt.version} · <a href="/export/${d.id}" download="${d.id}.csv">下载标准 CSV</a></p>`:''}<div class="row"><label>演示部门<select id="role"><option ${isProd?'selected':''}>生产部</option><option ${!isProd?'selected':''}>市场部</option></select></label><span class="muted">切换用于演示操作，不代表企业身份或权限隔离。</span></div></div>
<div class="panel"><h2>${isProd?'生产部 · 标准填报':'市场部 · 接收与核对'}</h2>${issues.length?`<div class="notice">${issues.map(esc).join('；')}<br>请补充缺失值和确认依据。不能用出厂量替代实际量。</div>`:'<div class="notice">必填字段和演示规则校验通过。</div>'}${c.difference!==null?`<p>出厂量 − 实际量：<strong>${esc(c.difference)} m³</strong>。差异原因须由业务核对。</p>`:''}
${isProd&&editable?`<div class="grid">${state.template.fields.map((f,i)=>`<label>${esc(f.name)}${f.required?' *':''}<input id="f${i}" value="${esc(c.values[f.name])}" ${f.name==='实际量'?'placeholder="例如 97.5"':''}></label>`).join('')}</div>`:fieldTable(d)}
${(isProd&&editable)||(!isProd&&['pending_market','market_processing'].includes(d.state))?'<label style="margin-top:16px">补充依据 / 复核结论<textarea id="note" placeholder="说明本次修改、复核或退回的依据；仅填写演示内容"></textarea></label>':''}
<div class="row" style="margin-top:14px">${isProd&&editable?`<button id="act-patch">保存补充并校验</button><button id="act-approve" ${!c.valid||d.state!=='draft'?'disabled':''}>确认复核当前版本</button><button id="act-submit" class="primary" ${d.approved_version!==d.version||d.state!=='draft'?'disabled':''}>提交标准数据</button>`:''}${!isProd&&d.state==='pending_market'?'<button id="act-accept" class="primary">接收并开始核对</button>':''}${!isProd&&d.state==='market_processing'?'<button id="act-complete" class="primary">记录结论并完成</button>':''}${!isProd&&['pending_market','market_processing'].includes(d.state)?'<button id="act-return">退回生产部补正</button>':''}${d.notification==='failed'?'<button id="act-retry">重试模拟通知</button>':''}</div>
${isProd&&editable?`<label style="margin-top:12px"><input id="fail" type="checkbox"> 本次演示通知发送失败（不影响入库，可单独重试）</label><p class="muted">${d.approved_version===d.version?'当前版本已通过演示复核。':'任何字段修改都会使旧复核失效。'}</p>`:''}${d.state==='completed'?'<div class="notice">本次业务交接已完成。可以到“落地建议”查看后续试点关注点。</div>':''}</div><div class="panel"><details><summary>查看字段来源与映射</summary>${fieldTable(d)}</details><h3>过程时间线</h3><div class="timeline">${d.events.map(e=>`<p><strong>${esc(e.event)}</strong> <small class="muted">${esc(new Date(e.time).toLocaleTimeString())}</small><br>${esc(typeof e.note==='string'?e.note:JSON.stringify(e.note))}</p>`).join('')}</div></div>`}
function renderConsult(){let ds=state.docs,total=ds.length,done=ds.filter(d=>d.state==='completed').length,failed=ds.filter(d=>d.notification==='failed').length,missing=ds.filter(d=>d.checked.missing.length).length,returned=ds.filter(d=>d.state==='returned').length;let suggestions=[['试点前置确认','单位、实际量含义和部门路由只是演示假设。','请生产部实际填写者与市场部接收者共同验证字段和交接。'],['数据去向可见性','每条入库记录显示目标位置、版本与 CSV。','请一线人员现场找到自己的记录，确认他们理解谁接着处理。']];if(missing)suggestions.push(['当前存在待补字段',`${missing} 条记录仍缺少必填信息。`,'核实这些字段在填报时是否拿得到；不要直接认为员工不配合。']);if(failed)suggestions.push(['通知需要恢复',`${failed} 条记录的模拟通知失败。`,'先重试并检查回执，入库成功不代表通知送达。']);if(returned)suggestions.push(['存在退回记录',`${returned} 条记录待生产部补正。`,'结合退回原因检查定义与例外，不按退回次数评员工绩效。']);$('consult').innerHTML=`<div class="panel"><h2>Consulting Agent · 基于状态的规则建议</h2><p class="muted">建议来自本地记录与预设规则；不是大模型诊断，也不是对真实员工的评估。</p><div class="grid"><div>演示记录<br><strong>${total}</strong></div><div>已完成交接<br><strong>${done}</strong></div><div>尚未完成<br><strong>${total-done}</strong></div></div></div><div class="panel"><h2>建议与依据</h2>${suggestions.map(s=>`<h3>${esc(s[0])}</h3><p class="muted">观察：${esc(s[1])}</p><p>${esc(s[2])}</p>`).join('')}<p class="notice">下一步由人确认试点范围、培训支持和规则修订；本页面不会自动安排会议或修改模板。</p></div><div class="panel"><h2>跨部门状态看板</h2><div class="scroll"><table><thead><tr><th>记录</th><th>数据</th><th>通知</th><th>业务状态</th></tr></thead><tbody>${ds.map(d=>`<tr><td>${esc(d.id)}</td><td>${d.receipt?'已入库':'草稿'}</td><td>${esc(notices[d.notification])}</td><td>${esc(names[d.state])}</td></tr>`).join('')||'<tr><td colspan="4">暂无记录</td></tr>'}</tbody></table></div></div>`}
function render(){renderPlan();renderWork();renderConsult();for(const id of ['plan','work','consult'])$(id).hidden=id!==tab;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)))}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});refresh().catch(e=>say(e.message));
</script></html>
