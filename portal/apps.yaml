# Registered applications. The portal issues tokens only for apps declared here;
# adding an app is a config edit, never a code change — the same rule as the
# field dictionary in data/mappings/.
apps:
  bridgeflow:
    # The audience claim BridgeFlow's backend verifies against portal_audience.
    audience: bridgeflow
    # Where the browser lands after a successful Feishu login (the dsh web page).
    # Must match the port you actually start dsh web on (scripts/start_web.py --port …).
    redirect_uri: "http://127.0.0.1:3082/"
    # Origins allowed to call /token cross-origin with the session cookie.
    origins:
      - "http://127.0.0.1:3082"
      - "http://localhost:3082"
